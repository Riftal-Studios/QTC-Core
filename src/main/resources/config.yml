plugin:
  debug: false
  language: en_US

storage:
  type: SQLITE
  mysql:
    host: localhost
    port: 3306
    database: qtccore
    username: root
    password: password

features:
  resource-nodes: true
  weapon-fusion: true
  armor-fusion: true
  magic-elements: true
  herbalism: true
  fishing-zones: true
  hunting: true

global:
  mmocore-integration: true
  mythiclib-integration: true
  placeholderapi-integration: true
  pyrofishing-integration: true

discord-api:
  enabled: true
  url: "http://localhost:8080"
  key: ""
  timeout: 5000

# Core systems
features-core:
  profiles: true
  reputation: true
  jobs: true
  staff-tasks: true

reputation:
  daily-login-bonus: 5

jobs:
  require-staff-verify-above: 0

staff-tasks:
  max-points: 100
