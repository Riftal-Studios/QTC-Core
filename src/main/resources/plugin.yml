name: QTCCore
version: 1.0
main: com.riftalstudios.qtccore.QTCCore
api-version: '1.21'
author: Riftal Studios
description: Custom RPG mechanics plugin for PaperMC servers

libraries:
  - "com.zaxxer:HikariCP:5.1.0"
  - "com.h2database:h2:2.2.224"

depend:
  - packetevents

commands:
  qtc:
    description: Main QTC Core command
    usage: /qtc

permissions:
  qtccore.admin:
    description: Full administrative access to QTC Core
    default: op
  qtccore.staff:
    description: Staff access to task management and job verification
    default: op
  qtccore.owner:
    description: Owner-level access
    default: op
  qtccore.link:
    description: Allows players to use /qtc link
    default: true
